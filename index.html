<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIIMS Saral 2.0 — E-Logbook Plugin Prototype</title>
<style>
  :root{
    --navy-900:#0c2b6e;
    --navy-800:#123a92;
    --blue-600:#1b3fae;
    --blue-500:#2a4fc9;
    --blue-50:#eef2fb;
    --gray-25:#f6f7fa;
    --gray-100:#eef0f4;
    --border:#e2e6ee;
    --text-900:#1c2333;
    --text-600:#4b5468;
    --text-400:#8991a3;
    --st-new-bg:#eef0f4; --st-new-fg:#5b6577;
    --st-review-bg:#e2e9fd; --st-review-fg:#1b45c9;
    --st-changes-bg:#fef3cd; --st-changes-fg:#92640a;
    --st-approved-mid-bg:#e2f6ef; --st-approved-mid-fg:#0e7d5f;
    --st-approved-bg:#dcf3e2; --st-approved-fg:#157a3d;
    --st-rejected-bg:#fbe3e3; --st-rejected-fg:#c22a2a;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--gray-25);color:var(--text-900);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .topbar{
    height:56px;background:linear-gradient(180deg,var(--navy-800),var(--navy-900));
    display:flex;align-items:center;gap:22px;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20;
  }
  .brandmark{display:flex;align-items:center;gap:9px;margin-right:6px;}
  .brandmark .logo{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy-900);font-weight:800;font-size:12px;letter-spacing:.5px;}
  .brandmark .name{font-weight:700;font-size:15px;line-height:1.1;}
  .brandmark .name small{display:block;font-weight:500;font-size:10px;opacity:.75;}
  .topnav{display:flex;align-items:center;gap:20px;font-size:13.5px;opacity:.92;}
  .topnav span{padding:6px 2px;border-bottom:2px solid transparent;}
  .topnav span.active{border-color:#7fa1ff;opacity:1;font-weight:600;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:14px;}
  .persona-switch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:20px;padding:4px 10px 4px 4px;}
  .persona-switch .avatar{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .persona-switch select{background:transparent;border:none;color:#fff;font-size:12.5px;font-weight:600;outline:none;}
  .persona-switch select option{color:#111;}
  .shell{display:flex;align-items:flex-start;}
  .sidebar{
    width:246px;flex:0 0 246px;background:#fff;border-right:1px solid var(--border);
    min-height:calc(100vh - 56px);padding:16px 12px;
  }
  .side-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-400);font-weight:700;margin:18px 8px 8px;}
  .side-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text-600);margin-bottom:2px;}
  .side-item .dot{width:6px;height:6px;border-radius:50%;background:var(--text-400);flex:0 0 6px;}
  .side-item.active{background:var(--blue-50);color:var(--blue-600);font-weight:700;}
  .side-item.active .dot{background:var(--blue-600);}
  .side-item.clickable:hover{background:var(--gray-100);cursor:pointer;}
  .side-item.static{opacity:.55;}
  .side-divider{height:1px;background:var(--border);margin:14px 4px;}
  .main{flex:1;min-width:0;padding:26px 30px 60px;}
  .banner{
    background:#fff8e6;border:1px solid #f2dfa6;color:#7a5a06;font-size:12.5px;padding:8px 14px;border-radius:8px;
    margin-bottom:14px;display:flex;gap:8px;align-items:center;
  }
  .page-toolbar{margin-bottom:10px;}
  .back-btn{display:inline-flex;align-items:center;gap:4px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:20px;margin:0 0 4px;}
  .page-head p{margin:0;color:var(--text-600);font-size:13px;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;}
  .btn-primary{background:var(--blue-600);color:#fff;}
  .btn-primary:hover{background:var(--navy-800);}
  .btn-ghost{background:#fff;color:var(--blue-600);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--blue-50);}
  .btn-quicklink{background:var(--tile-bg,#eef2fb);color:var(--tile-fg,#1b3fae);border:1px solid var(--tile-bd,#d7e1fb);padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:filter .15s, box-shadow .15s;}
  .btn-quicklink:hover{filter:saturate(1.25) brightness(.97);box-shadow:var(--shadow);}
  .btn-quicklink .ql-svg{flex:0 0 auto;stroke:currentColor;}
  .btn-pastel-add{background:var(--st-approved-bg);color:var(--st-approved-fg);border:1px solid #bfe6cc;padding:8px 16px;font-size:13px;font-weight:700;}
  .btn-pastel-add:hover{filter:brightness(.96);}
  .btn-pastel-review{background:var(--st-changes-bg);color:var(--st-changes-fg);border:1px solid #f0dca0;padding:8px 16px;font-size:13px;font-weight:700;}
  .btn-pastel-review:hover{filter:brightness(.96);}
  .btn-danger{background:#fff;color:#c22a2a;border:1px solid #f3caca;}
  .btn-danger:hover{background:#fbe3e3;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .stat-card .num{font-size:24px;font-weight:800;color:var(--navy-900);}
  .stat-card .lbl{font-size:12.5px;color:var(--text-600);margin-top:2px;}
  .stat-card.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .stat-card.clickable:hover{box-shadow:var(--shadow);border-color:var(--blue-500);}
  .module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .module-tile{background:#fbfcfe;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .module-tile:hover{box-shadow:var(--shadow);border-color:var(--blue-500);background:#fff;}
  .module-tile .mt-icon{font-size:22px;margin-bottom:8px;}
  .module-tile .mt-label{font-weight:700;font-size:13.5px;color:var(--navy-900);margin-bottom:3px;}
  .module-tile .mt-desc{font-size:11.5px;color:var(--text-600);margin-bottom:8px;}
  .module-tile .mt-stat{font-size:11px;font-weight:700;color:var(--blue-600);}

  /* ---------- Section quick-link tiles (square pastel icon cards) ---------- */
  .section-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));gap:8px;}
  .section-tile{
    aspect-ratio:1/1;background:var(--tile-bg,#eef2fb);border:1px solid var(--tile-bd,#d7e1fb);border-radius:10px;
    color:var(--tile-fg,#1b3fae);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;padding:7px 5px;text-align:center;transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .section-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:saturate(1.25);}
  .section-tile .ql-svg{stroke:currentColor;}
  .section-tile-sec{font-size:8.5px;font-weight:700;letter-spacing:.03em;color:var(--tile-fg);opacity:.7;text-transform:uppercase;}
  .section-tile-label{font-size:9.5px;font-weight:700;color:var(--tile-fg);line-height:1.2;}

  /* ---------- Collapsible group (procedure checklist, etc.) ---------- */
  .collapse-group{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .collapse-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer;background:#fbfcfe;user-select:none;}
  .collapse-head:hover{background:var(--gray-100);}
  .collapse-head .ct-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-600);font-weight:700;}
  .collapse-head .ct-meta{font-size:11.5px;color:var(--text-400);font-weight:600;}
  .collapse-head .ct-arrow{font-size:11px;color:var(--text-400);transition:transform .15s;}
  .collapse-group.open .ct-arrow{transform:rotate(90deg);}
  .collapse-body{display:none;padding:0 2px;}
  .collapse-group.open .collapse-body{display:block;}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
  .card h3{margin:0 0 14px;font-size:14.5px;}
  .card h3 small{color:var(--text-400);font-weight:500;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-400);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:0 10px 10px;border-bottom:1px solid var(--border);}
  td{padding:12px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.rowlink:hover{background:var(--gray-25);cursor:pointer;}
  .entry-title{font-weight:700;color:var(--navy-900);}
  .entry-sub{color:var(--text-400);font-size:11.5px;margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge.st-new{background:var(--st-new-bg);color:var(--st-new-fg);}
  .badge.st-review{background:var(--st-review-bg);color:var(--st-review-fg);}
  .badge.st-changes{background:var(--st-changes-bg);color:var(--st-changes-fg);}
  .badge.st-approved-mid{background:var(--st-approved-mid-bg);color:var(--st-approved-mid-fg);}
  .badge.st-approved{background:var(--st-approved-bg);color:var(--st-approved-fg);}
  .badge.st-rejected{background:var(--st-rejected-bg);color:var(--st-rejected-fg);}
  .role-chip{display:inline-block;background:var(--gray-100);color:var(--text-600);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:4px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--text-600);background:#fff;border:1px solid var(--border);}
  .tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
  .search-row{margin-bottom:14px;}
  .search-input{width:100%;max-width:380px;border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 32px;font-size:13px;background:#fbfcfe url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238991a3" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 10px center;}
  .search-input:focus{outline:2px solid var(--blue-500);outline-offset:1px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:16px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-600);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--text-400);margin-top:4px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fbfcfe;color:var(--text-900);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .dropzone{border:1.5px dashed #c6cfe6;border-radius:10px;padding:22px;text-align:center;color:var(--text-400);font-size:12.5px;background:#fbfcfe;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px;margin-top:6px;}
  .ms-wrap{border:1px solid var(--border);border-radius:8px;padding:9px;background:#fbfcfe;}
  .ms-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;min-height:0;}
  .ms-chips:empty{margin-bottom:0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-50);color:var(--blue-600);border:1px solid #d7e1fb;border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;font-weight:700;}
  .chip-x{cursor:pointer;font-weight:800;padding:0 3px;border-radius:50%;line-height:1;}
  .chip-x:hover{color:#c22a2a;}
  .ms-placeholder{font-size:12px;color:var(--text-400);}
  .ms-search{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12.5px;margin-bottom:7px;background:#fff;}
  .ms-options{max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:6px;background:#fff;}
  .ms-option{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;}
  .ms-option:last-child{border-bottom:none;}
  .ms-option:hover{background:var(--gray-100);}
  .ms-option.selected{background:var(--blue-50);color:var(--blue-600);font-weight:700;}
  .ms-check{font-size:11px;}
  .ms-empty{padding:10px;font-size:12px;color:var(--text-400);text-align:center;}
  .ms-count{font-size:11px;color:var(--text-400);padding:6px 2px 0;}
  .detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13px;margin-bottom:6px;}
  .kv .k{color:var(--text-400);font-weight:600;}
  .attachment{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;margin-bottom:8px;background:#fbfcfe;}
  .attachment .clip{color:var(--blue-600);}
  .thread{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .msg{border-radius:10px;padding:10px 13px;font-size:13px;max-width:92%;border:1px solid var(--border);}
  .msg .who{font-weight:700;font-size:12px;margin-bottom:3px;display:flex;gap:6px;align-items:center;}
  .msg .when{font-weight:400;color:var(--text-400);font-size:11px;}
  .msg.role-jr{background:#f4f6fb;}
  .msg.role-sr{background:#eef7f3;}
  .msg.role-faculty{background:#fbf3e8;}
  .stepper{display:flex;align-items:center;margin:6px 0 22px;}
  .step{flex:1;text-align:center;position:relative;}
  .step .circ{width:30px;height:30px;border-radius:50%;background:var(--gray-100);color:var(--text-400);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;margin:0 auto 8px;border:2px solid var(--gray-100);}
  .step.done .circ{background:var(--blue-50);color:var(--blue-600);border-color:var(--blue-600);}
  .step.current .circ{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}
  .step .lbl{font-size:11.5px;font-weight:700;color:var(--text-600);}
  .step:not(:last-child)::after{content:"";position:absolute;top:15px;left:55%;width:90%;height:2px;background:var(--gray-100);z-index:0;}
  .step.done:not(:last-child)::after{background:var(--blue-600);}
  .action-panel{background:var(--blue-50);border:1px solid #d7e1fb;border-radius:var(--radius);padding:16px 18px;}
  .action-panel h4{margin:0 0 4px;font-size:13.5px;}
  .action-panel p{margin:0 0 12px;font-size:12px;color:var(--text-600);}
  .action-panel textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;font-size:12.5px;font-family:inherit;min-height:70px;margin-bottom:10px;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;}
  .locked-note{display:flex;gap:8px;align-items:center;background:#f4f6fb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-600);}
  .flow-wrap{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 18px;}
  .flow-card{flex:0 0 230px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .flow-card .stage-no{font-size:11px;font-weight:800;color:var(--blue-600);letter-spacing:.04em;text-transform:uppercase;}
  .flow-card h4{margin:6px 0 8px;font-size:14px;}
  .flow-card .who{margin-bottom:10px;}
  .flow-card ul{margin:0;padding-left:16px;font-size:12px;color:var(--text-600);}
  .flow-card ul li{margin-bottom:4px;}
  .flow-arrow{align-self:center;color:var(--text-400);font-size:18px;flex:0 0 auto;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .caseTypeRow{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--gray-100);font-size:13px;}
  .caseTypeRow:last-child{border-bottom:none;}
  .switch{width:34px;height:19px;border-radius:20px;background:var(--gray-100);position:relative;display:inline-block;cursor:pointer;transition:.2s;}
  .switch.on{background:var(--blue-600);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on::after{left:17px;}
  .empty{color:var(--text-400);font-size:12.5px;text-align:center;padding:26px 0;}
  .pdf-modal{position:fixed;inset:0;background:rgba(12,16,30,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;}
  .pdf-modal-inner{background:#fff;border-radius:12px;width:100%;height:100%;max-width:1100px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .pdf-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
  .pdf-modal-head h4{margin:0;font-size:14px;color:var(--navy-900);}
  .pdf-modal-actions{display:flex;gap:8px;align-items:center;}
  .pdf-modal-body{flex:1;background:#525659;}
  .pdf-modal-body iframe{width:100%;height:100%;border:0;}
  .form-modal-inner{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .form-modal-body{padding:20px 22px;}
  .conn-badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap;}
  .conn-badge.offline{background:#f2dfa6;color:#7a5a06;}
  .global-search{position:relative;}
  .global-search input{width:210px;border:none;border-radius:8px;padding:7px 10px 7px 30px;font-size:12.5px;background:rgba(255,255,255,.14);color:#fff;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');background-repeat:no-repeat;background-position:9px center;}
  .global-search input::placeholder{color:rgba(255,255,255,.75);}
  .global-search input:focus{outline:2px solid #7fa1ff;background-color:rgba(255,255,255,.22);}
  .gs-results{position:absolute;top:36px;right:0;width:340px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:40;}
  .gs-group-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-400);padding:8px 12px 4px;}
  .gs-item{padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--text-900);border-bottom:1px solid var(--gray-100);}
  .gs-item:hover{background:var(--gray-100);}
  .gs-item .gs-sub{color:var(--text-400);font-size:11px;}
  .gs-empty{padding:14px 12px;font-size:12px;color:var(--text-400);text-align:center;}

  /* ---------- Mobile "Add Record" floating action button ---------- */
  .mobile-fab{display:none;}

  /* ---------- Responsive layout ---------- */
  @media (max-width: 760px){
    .topnav{display:none;}
    .global-search input{width:120px;}
    .topbar{gap:10px;padding:0 10px;}
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;min-height:auto;max-height:220px;overflow-y:auto;border-right:none;border-bottom:1px solid var(--border);}
    .main{padding:16px 14px 90px;}

/* ---------------------------------------------------------------
   chaptersAuthorableBy — which sections a role can CREATE a record
   under. JR: every active section. SR: sections that route straight
   to Faculty, SR-only, or are self-certified. Faculty: every active
   section (own entries self-certify).
--------------------------------------------------------------- */
function chaptersAuthorableBy(persona){
  const active = CURRICULUM_CHAPTERS.filter(c=>c.active!==false);
  if(persona==="sr") return active.filter(c=>c.route!=="sr_faculty");
  return active;
}
function chapterByNo(no){ return CURRICULUM_CHAPTERS.find(c=>c.no===Number(no)); }
let chapterCounter = Math.max(...CURRICULUM_CHAPTERS.map(c=>c.no));
function toggleChapterActive(no){
  const ch = chapterByNo(no);
  if(ch){ ch.active = ch.active===false ? true : false; toast(`"${ch.title}" is now ${ch.active?'active':'inactive'}.`); renderAll(); }
}
function addNewChapterFromModal(){
  const title = document.getElementById("newSectionTitle").value.trim();
  const route = document.getElementById("newSectionRoute").value;
  const lessonsRaw = document.getElementById("newSectionLessons").value.trim();
  if(!title){ toast("Please enter a section title."); return; }
  const lessons = lessonsRaw ? lessonsRaw.split(",").map(s=>s.trim()).filter(Boolean) : ["General"];
  chapterCounter++;
  CURRICULUM_CHAPTERS.push({ no:chapterCounter, title, route, active:true, lessons });
  closeFormModal();
  toast(`New section "${title}" added and activated — appears immediately for JR/SR.`);
  renderAll();
}

function saveEditedSection(chNo){
  const ch = chapterByNo(chNo);
  if(!ch) return;
  const title = document.getElementById("editSectionTitle").value.trim();
  const lessonsRaw = document.getElementById("editSectionLessons").value.trim();
  const route = document.getElementById("editSectionRoute").value;
  if(!title){ toast("Section title cannot be empty."); return; }
  const lessons = lessonsRaw ? lessonsRaw.split(",").map(s=>s.trim()).filter(Boolean) : ["General"];
  ch.title = title;
  ch.lessons = lessons;
  ch.route = route;
  closeFormModal();
  toast(`Sec.${chNo} updated — changes are live for JR, SR and Faculty.`);
  renderAll();
}

const FULL_STAGE_MAP = {"New":0,"In SR Review":1,"SR Requested Changes":1,"SR Approved":1,"In Faculty Review":2,"Faculty Requested Changes":2,"Faculty Rejected":2,"Faculty Approved":3};
const SKIP_SR_STAGE_MAP = {"New":0,"In Faculty Review":1,"Faculty Requested Changes":1,"Faculty Rejected":1,"Faculty Approved":2};
const FACULTY_SELF_STAGE_MAP = {"New":0,"Faculty Approved":1};
const SELF_ONLY_STAGE_MAP = {"New":0,"Completed":1};
function getEntryRoute(e){
  if(e.chapterNo){
    const ch = chapterByNo(e.chapterNo);
    if(ch) return ch.route;
  }
  const ct = caseTypes.find(c=>c.name===e.type);
  return ct ? ct.route : "sr_faculty";
}
function stageConfig(e){
  const route = getEntryRoute(e);
  if(route==="self_only"){
    return { labels:["Entry Creation","Completed"], map: SELF_ONLY_STAGE_MAP };
  }
  if(e.authorRole==="faculty"){
    return { labels:["Entry Creation","Self-Certified"], map: FACULTY_SELF_STAGE_MAP };
  }
  const skipSR = e.authorRole==="sr" || route==="faculty_only";
  return skipSR
    ? { labels:["Entry Creation","Faculty Review","Final Approval"], map: SKIP_SR_STAGE_MAP }
    : { labels:["Entry Creation","Senior Resident Review","Faculty Review","Final Approval"], map: FULL_STAGE_MAP };
}

  history.push({persona: state.persona, screen: state.screen, entryId: state.entryId, navParam: state.navParam});

  } else {
    state.screen = "dashboard"; state.entryId = null; state.navParam = null;

  renderAll(); window.scrollTo({top:0, behavior:"instant"});
}

function filterListByCategory(id, chapterNo){
  state.categoryFilter = state.categoryFilter || {};
  state.categoryFilter[id] = chapterNo;
  state.lessonFilter = state.lessonFilter || {};
  state.lessonFilter[id] = "";
  setPage(id, 1);
  renderAll();
}
function filterListByLesson(id, lesson){
  state.lessonFilter = state.lessonFilter || {};
  state.lessonFilter[id] = lesson;
  setPage(id, 1);
  renderAll();
}
function renderList(id, q){
  const meta = lists[id];
  if(!meta) return;
  let list = meta.getData();
  if(q && q.trim()){
    const qq = q.trim().toLowerCase();
    list = list.filter(e =>
      e.title.toLowerCase().includes(qq) ||
      e.type.toLowerCase().includes(qq) ||
      e.status.toLowerCase().includes(qq) ||
      e.jr.toLowerCase().includes(qq) ||
      e.srs.join(" ").toLowerCase().includes(qq) ||
      e.faculty.join(" ").toLowerCase().includes(qq)
    );
  }
  const catVal = (state.categoryFilter && state.categoryFilter[id]) || "";
  if(catVal){
    list = list.filter(e => e.chapterNo === Number(catVal));
  }
  const lessonVal = (state.lessonFilter && state.lessonFilter[id]) || "";
  if(lessonVal){
    list = list.filter(e => e.lesson === lessonVal);
  }
  const { pageItems, page, totalPages } = paginateList(sortByUpdated(list), id, 8);
  const body = pageItems.length
    ? entryTable(pageItems, meta.role, meta.hideSRCols, meta.hideFacultyCol) + paginationHTML(id, page, totalPages)
    : (meta.emptyHTML ? meta.emptyHTML() : entryTable([], meta.role, meta.hideSRCols, meta.hideFacultyCol));
  document.getElementById("list_"+id).innerHTML = body;
}

/* ---------------------------------------------------------------
   SHARED PAGINATION
--------------------------------------------------------------- */
function getPage(id){ return (state.page && state.page[id]) || 1; }
function setPage(id, page){ state.page = state.page || {}; state.page[id] = page; }
function paginateList(list, id, perPage){
  perPage = perPage || 8;
  const totalPages = Math.max(1, Math.ceil(list.length/perPage));
  let page = getPage(id);
  if(page > totalPages) page = totalPages;
  if(page < 1) page = 1;
  setPage(id, page);
  const startIdx = (page-1)*perPage;
  return { pageItems: list.slice(startIdx, startIdx+perPage), page, totalPages, total:list.length };
}
function paginationHTML(id, page, totalPages){
  if(totalPages<=1) return "";
  return `<div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:12px;font-size:12.5px;color:var(--text-600);">
    <span>Page ${page} of ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" ${page<=1?'disabled':''} onclick="gotoPage('${id}', ${page-1})">← Prev</button>
    <button class="btn btn-ghost btn-sm" ${page>=totalPages?'disabled':''} onclick="gotoPage('${id}', ${page+1})">Next →</button>
  </div>`;
}
function gotoPage(id, page){
  setPage(id, page);
  if(lists[id]){ renderList(id, state.searchTerms[id]||""); } else { renderAll(); }
}

    const actionPlan = document.getElementById("srfActionPlan")?.value || "";
    selfEvalOverall = document.getElementById("srfOverall")?.value || "";
    description = strengths;
    reflection = [improve ? "To improve: "+improve : "", actionPlan ? "Action plan: "+actionPlan : ""].filter(Boolean).join("  ");
  } else {
    description = document.getElementById("caseDescriptionInput")?.value || "";
    reflection = document.getElementById("learningInput")?.value || "";
  }

  let srs = [], faculty = [];
  let peerWitnesses = [];
  if(persona==="faculty"){
    faculty = [PERSONA_NAMES.faculty];
    peerWitnesses = formState.reviewerSelected.filter(n => n !== PERSONA_NAMES.faculty);
  } else {
    const selectedReviewers = formState.reviewerSelected.map(n=>reviewerByName(n)).filter(Boolean);
    srs = selectedReviewers.filter(r=>r.role==="sr").map(r=>r.name);
    faculty = selectedReviewers.filter(r=>r.role==="faculty").map(r=>r.name);
  }

  entryIdCounter++;
  updateCounter++;
  const isFacultySelfCert = persona==="faculty" && status==="Faculty Approved";
  const selfCertText = peerWitnesses.length ? `Self-certified and recorded. Peer-acknowledged by ${peerWitnesses.join(", ")}.` : "Self-certified and recorded.";
  const commentText = isFacultySelfCert ? selfCertText : (status==="Completed" ? "Logged — no review required for this section." : "Submitted for review.");
  const entry = {
    id: entryIdCounter,
    title, type: ch.title, chapterNo: ch.no, lesson,
    daysPending: 0, status,
    jr: PERSONA_NAMES[persona], authorRole: persona,
    srs, faculty,
    start: date, end: date, updatedAt: updateCounter,
    description, reflection, notes: peerWitnesses.length ? `Peer-acknowledged by ${peerWitnesses.join(", ")}.` : "",
    attachments: [],
    comments: status==="New" ? [] : [{author:PERSONA_NAMES[persona], role:persona, text: commentText, time: nowStamp()}],
  };
  if(isSelfReflection){ entry.selfEvalRatings = selfEvalRatings; entry.selfEvalOverall = selfEvalOverall; }
  entries.push(entry);
  return entry;
}

function submitForRoute(){
  const chNo = document.getElementById("chapterSelect").value;
  const ch = chapterByNo(chNo);
  const lesson = document.getElementById("lessonSelect")?.value || "";
  const isSelfReflection = ch && ch.no===12 && lesson==="Self Reflection";
  const route = ch ? ch.route : "sr_faculty";
  if(!isSelfReflection){
    const attest = document.getElementById("phiAttestCheck");
    if(attest && !attest.checked){
      toast("Please confirm the no-patient-identifiers checkbox before submitting.");
      attest.parentElement.style.color = "#c22a2a";
      return;
    }
    const phiFlags = possiblePhiWarning();
    if(phiFlags.length){
      toast("Possible identifying info detected (" + phiFlags[0] + ") — please review before submitting.");
      return;
    }
  }
  if(!navigator.onLine){
    queueOfflineDraft({ kind:"submission", ...currentEntryFormSnapshot() });
    toast("No internet — entry captured offline. It'll submit automatically once you're back online.");
    goto('manageEntries');
    return;
  }
  if(state.persona==="faculty"){
    buildEntryFromForm("Faculty Approved");
    toast("Entry self-certified and recorded — no reviewer required.");
    goto('manageEntries');
    return;
  }
  if(route==="self_only"){
    buildEntryFromForm("Completed");
    toast("Entry saved — this section does not require review.");
    goto('manageEntries');
    return;
  }
  if(state.persona==="sr"){
    buildEntryFromForm("In Faculty Review");
    toast("Entry submitted for review.");
    goto('manageEntries');
    return;
  }
  const status = route==="faculty_only" ? "In Faculty Review" : "In SR Review";
  buildEntryFromForm(status);
  toast("Entry submitted for review.");
  goto('manageEntries');
}

function daysBetween(from,to){
  if(!from || !to) return 0;
  const d1 = new Date(from), d2 = new Date(to);
  const diff = Math.round((d2-d1)/(1000*60*60*24)) + 1;
  return diff > 0 ? diff : 0;
}

function residentHash(name){ let h=0; for(let i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))>>>0; } return h; }
function residentCompletionPct(name){
  if(name===PERSONA_NAMES.jr){
    const done = Object.values(procedureProgress).reduce((a,b)=>a+b,0);
    const target = PROCEDURES.reduce((a,p)=>a+p.target,0);
    return Math.round((done/target)*100);
  }
  return 38 + (residentHash(name)%58);
}

--------------------------------------------------------------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const TITLE_BANK = {
  5:["Seminar — Sepsis Recognition","Journal Club — Airway Registry Data","Case Presentation — Anaphylaxis","Simulation — Mass Casualty Drill"],
  6:["Clinical Skill Session — Secondary Survey","Clinical Skill Session — Respiratory Examination","Clinical Skill Session — Leadership"],
  7:["CBD — Acute Coronary Syndrome","CBD — Paediatric Sepsis","Mini-CEX — Trauma Primary Survey"],
  8:["DOPS — Central Line Insertion","DOPS — Chest Tube","DOPS — Lumbar Puncture"],
  9:["POCUS — FAST Scan","ECG Analysis — Arrhythmia Series"],
  10:["ATLS Course","Difficult Airway Workshop","National EM Conference — Poster"],
  11:["Audit — Door-to-Needle Time"],
  12:["Self Reflection — Q2","Awards & Achievement — Poster Prize","Thesis Review — Progress Update"],
};
function isRealResident(name){ return name===PERSONA_NAMES.jr || name===PERSONA_NAMES.sr; }
function residentChapterBreakdown(name, role){
  const chapters = role==="sr" ? CURRICULUM_CHAPTERS.filter(c=>c.route!=="sr_faculty") : CURRICULUM_CHAPTERS;
  const real = isRealResident(name);
  return chapters.map(ch=>{
    if(real){
      const logged = entries.filter(e=>e.chapterNo===ch.no && e.jr===name && e.authorRole===role).length;
      const approved = entries.filter(e=>e.chapterNo===ch.no && e.jr===name && e.authorRole===role && (e.status==="Faculty Approved"||e.status==="Completed")).length;
      return {chapter:ch, logged, approved};
    }
    const rnd = mulberry32(residentHash(name+"|ch"+ch.no));
    const logged = Math.round(rnd()*6);
    const approved = Math.min(logged, Math.round(logged*(0.4+rnd()*0.5)));
    return {chapter:ch, logged, approved};
  });
}
function residentProcedureBreakdown(name){
  const real = isRealResident(name);
  return PROCEDURES.map(proc=>{
    if(real && name===PERSONA_NAMES.jr) return {proc, done: procedureProgress[proc.name]||0};
    const rnd = mulberry32(residentHash(name+"|proc"+proc.seq));
    const done = Math.min(proc.target, Math.round(rnd()*proc.target*1.15));
    return {proc, done};
  });
}
function residentRotationSummary(name){
  if(name===PERSONA_NAMES.jr) return rotationLog.map(r=>({...r}));
  const rnd = mulberry32(residentHash(name+"|rot"));
  const count = 3 + Math.floor(rnd()*3);
  const picks = [];
  let cursor = new Date("2024-08-01");
  for(let i=0;i<count;i++){
    const days = 14 + Math.floor(rnd()*60);
    const from = new Date(cursor);
    const to = new Date(cursor); to.setDate(to.getDate()+days-1);
    const rotation = ROTATIONS[Math.floor(rnd()*ROTATIONS.length)].name;
    picks.push({from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10), rotation, attachment: rnd()>0.4 ? "Posting_Certificate.pdf" : null});
    cursor = new Date(to); cursor.setDate(cursor.getDate()+1);
  }
  return picks;
}
function residentSampleEntries(name, role){
  const real = isRealResident(name);
  if(real) return sortByUpdated(entries.filter(e=>e.jr===name && e.authorRole===role));
  const rnd = mulberry32(residentHash(name+"|entries"));
  const statuses = role==="sr"
    ? ["Faculty Approved","In Faculty Review","Faculty Requested Changes"]
    : ["Faculty Approved","In Faculty Review","In SR Review","SR Requested Changes","New"];
  const chapters = role==="sr" ? [5,10,11,12] : [5,6,7,8,9,10,11,12];
  const count = 4 + Math.floor(rnd()*4);
  const out=[];
  for(let i=0;i<count;i++){
    const chNo = chapters[Math.floor(rnd()*chapters.length)];
    const bank = TITLE_BANK[chNo] || ["Logged Activity"];
    const title = bank[Math.floor(rnd()*bank.length)];
    let status = statuses[Math.floor(rnd()*statuses.length)];
    if(chNo===12) status = rnd()>0.3 ? "Completed" : "New";
    const score = rnd()>0.3 ? (1+Math.floor(rnd()*5)) : null;
    const month = 1+Math.floor(rnd()*8);
    const monthDay = 1+Math.floor(rnd()*27);
    const date = `2026-${String(month).padStart(2,'0')}-${String(monthDay).padStart(2,'0')}`;
    out.push({title, chapterNo:chNo, status, score, date, synthetic:true});
  }
  return out.sort((a,b)=> b.date.localeCompare(a.date));
}

function stepperHTML(e){
  const cfg = stageConfig(e);
  const stage = cfg.map[e.status] !== undefined ? cfg.map[e.status] : 0;
  return `<div class="stepper">
    ${cfg.labels.map((l,i)=>`
      <div class="step ${i<stage?'done':''} ${i===stage?'current':''}">
        <div class="circ">${i<stage?'✓':i+1}</div>
        <div class="lbl">${l}</div>
      </div>`).join("")}
  </div>`;
}

function assignFacultyAndForward(id){
  const sel = document.getElementById("facAssignSelect");
  const facName = sel ? sel.value : "";
  const scoreSel = document.getElementById("srScoreSelect");
  const score = scoreSel && scoreSel.value !== "" ? parseInt(scoreSel.value, 10) : null;
  const e = entries.find(x=>x.id===id);
  e.faculty = facName ? [facName] : [];
  if(score !== null) e.srScore = score;
  const box = document.getElementById("commentBox");
  const text = box && box.value.trim() ? box.value.trim() : "Reviewed and approved.";
  const scoreMsg = score !== null ? ` Score: ${score}/5.` : "";
  const facMsg = facName ? ` Assigned to ${facName} for Faculty review.` : " Forwarded to the Faculty review queue (no specific reviewer assigned).";
  advanceStatus(id, "In Faculty Review", PERSONA_NAMES.sr, "sr", text + scoreMsg + facMsg);
}
function facultyReviewAction(id, newStatus){
  const scoreSel = document.getElementById("facultyScoreSelect");
  const score = scoreSel && scoreSel.value !== "" ? parseInt(scoreSel.value, 10) : null;
  const e = entries.find(x=>x.id===id);
  if(score !== null) e.facultyScore = score;
  const box = document.getElementById("commentBox");
  const text = box && box.value.trim() ? box.value.trim() : (newStatus.includes("Requested") ? "Please review and revise the noted sections." : (newStatus.includes("Rejected") ? "This submission does not meet requirements." : "Reviewed and approved."));
  const scoreMsg = score !== null ? ` Score: ${score}/5.` : "";
  advanceStatus(id, newStatus, PERSONA_NAMES.faculty, "faculty", text + scoreMsg);
}
function reviewAction(id, newStatus, role){
  const box = document.getElementById("commentBox");
  const text = box && box.value.trim() ? box.value.trim() : (newStatus.includes("Requested") ? "Please review and revise the noted sections." : (newStatus.includes("Rejected") ? "This submission does not meet requirements." : "Reviewed and approved."));
  advanceStatus(id, newStatus, PERSONA_NAMES[role], role, text);
}
function advanceStatus(id, newStatus, author, role, text){
  const e = entries.find(x=>x.id===id);
  e.status = newStatus;
  e.updatedAt = ++updateCounter;
  e.daysPending = 0;
  e.comments.push({author, role, text, time: nowStamp()});
  toast(`Status updated → ${newStatus}`);
  renderAll();
}

function resetFormState(){

function reviewerFilterOptions(){

function reviewerToggle(name){

function renderReviewerChips(){

function renderReviewerOptions(){
  const q = (formState.reviewerQuery || "").toLowerCase();

  const pool = state.persona==="faculty" ? REVIEWER_DIRECTORY.filter(r=>r.role==="faculty" && r.name!==PERSONA_NAMES.faculty) : REVIEWER_DIRECTORY;

      r.name.toLowerCase().includes(q) ||
      r.designation.toLowerCase().includes(q) ||
      r.email.toLowerCase().includes(q) ||
      r.role.toLowerCase().includes(q)
    ) : pool;

  if(!el) return;
  el.innerHTML = list.length
    ? list.map(r=>`

      + `<div class="ms-count">${list.length} of ${pool.length} shown</div>`
    : `<div class="ms-empty">No matching reviewers</div>`;

}

function myMsfRequests(name){ return msfRequests.filter(r=>r.candidate===name); }
function msfAssignedToMe(name){ return msfRequests.filter(r=>r.assessor===name && r.status==="Pending Response"); }
function msfAsChiefGuide(name){ return msfRequests.filter(r=>r.chiefGuide===name && r.status==="Submitted"); }
function screenMSF(){
  const persona = state.persona;
  const name = PERSONA_NAMES[persona];
  const mine = [...myMsfRequests(name)].sort((a,b)=> b.requestedAt.localeCompare(a.requestedAt));

  const asChief = msfAsChiefGuide(name);
  return `
    <div class="page-head">
      <div><h1>Multi-Source Feedback (MSF)</h1><p>Request 360° feedback from a peer, senior or Faculty member of your choice. Individual responses go only to the Chief Guide you select — not to you.</p></div>

        <tr><th>Candidate</th><th>Requested</th><th>Chief Guide</th><th></th></tr>
        ${assignedToMe.map(r=>`<tr><td>${r.candidate}</td><td>${r.requestedAt}</td><td>${r.chiefGuide}</td><td><button class="btn btn-primary btn-sm" onclick="openMsfFillModal(${r.id})">Fill Feedback</button></td></tr>`).join("")}
      </table>

        <tr><th>Candidate</th><th>Assessor</th><th>Assessor Role</th><th>Submitted</th><th></th></tr>
        ${asChief.map(r=>`<tr><td>${r.candidate}</td><td>${r.assessor}</td><td>${r.assessorRole}</td><td>${r.submittedAt}</td><td><button class="btn btn-ghost btn-sm" onclick="openMsfViewModal(${r.id})">View</button></td></tr>`).join("")}
      </table>
    </div>` : ""}
    <div class="card">
      <h3>My Feedback Requests <small>${mine.length} total &middot; individual responses are confidential to your Chief Guide</small></h3>
      ${mine.length ? `
      <table>
        <tr><th>Assessor</th><th>Assessor Role</th><th>Chief Guide</th><th>Requested</th><th>Status</th></tr>
        ${mine.map(r=>`<tr><td>${r.assessor}</td><td>${r.assessorRole}</td><td>${r.chiefGuide}</td><td>${r.requestedAt}</td><td>${r.status==="Submitted" ? '<span class="badge st-approved">Submitted</span>' : '<span class="badge st-review">Pending Response</span>'}</td></tr>`).join("")}

      ` : `<div class="empty">No MSF requests yet — click "+ Request Feedback" to ask someone to assess you.</div>`}
    </div>
  `;
}
function deriveAssessorRole(name){
  if(FAC_USERS.includes(name)) return "Faculty";
  if(SR_USERS.includes(name)) return "Senior Resident";
  if(JR_USERS.includes(name)) return "Junior Resident";
  return "Other";
}

  if(!r) return;
  r.interaction = document.getElementById("msfInteraction").value;
  ["comm","prof","team","reliability","leadership","overall"].forEach(k=>{
    r.ratings[k] = document.getElementById("msfDomain_"+k).value;
  });
  r.doingWell = document.getElementById("msfDoingWell").value;
  r.improve = document.getElementById("msfImprove").value;
  r.concerns = document.getElementById("msfConcerns").value;
  const concernEl = document.getElementById("msfConcernDetails");
  r.concernDetails = concernEl ? concernEl.value : "";
  r.status = "Submitted";
  r.submittedAt = todayStr();
  r.updatedAt = ++updateCounter;
  closeFormModal();
  toast(`Feedback submitted — visible only to ${r.chiefGuide}.`);
  renderAll();
}

  const r = msfRequests.find(x=>x.id===id);

  const domainRow = (label,key) => `<div class="kv"><div class="k">${label}</div><div>${r.ratings[key]||"—"}</div></div>`;

let offlineDrafts = [];
function updateConnBadge(){
  const el = document.getElementById("connStatus");
  if(!el) return;
  if(navigator.onLine){
    el.textContent = "Online";
    el.classList.remove("offline");
  } else {
    el.textContent = `Offline \u2014 Draft Mode${offlineDrafts.length ? " ("+offlineDrafts.length+")" : ""}`;
    el.classList.add("offline");
  }
}
function queueOfflineDraft(payload){
  offlineDrafts.push({ ...payload, savedAt: nowStamp() });
  updateConnBadge();
}
function syncOfflineDrafts(){
  if(offlineDrafts.length){
    toast(`Back online \u2014 ${offlineDrafts.length} offline draft${offlineDrafts.length===1?'':'s'} synced.`);
    offlineDrafts = [];
  }
  updateConnBadge();
}
window.addEventListener("online", syncOfflineDrafts);
window.addEventListener("offline", ()=>{ updateConnBadge(); toast("No internet detected \u2014 entries will be captured offline and synced automatically once you\'re back online."); });

function runGlobalSearch(q){
  const box = document.getElementById("gsResults");
  q = (q||"").trim().toLowerCase();
  if(!q){ box.innerHTML = ""; box.className = ""; return; }
  box.className = "gs-results";

  const matchedEntries = entries.filter(e =>
    e.title.toLowerCase().includes(q) || e.jr.toLowerCase().includes(q) || entryTypeLabel(e).toLowerCase().includes(q)
  ).slice(0,5);

  const allPeople = [
    ...FAC_USERS.map(n=>({name:n, role:"Faculty"})),
    ...SR_USERS.map(n=>({name:n, role:"Senior Resident"})),
    ...JR_USERS.map(n=>({name:n, role:"Junior Resident"})),
  ];
  const matchedPeople = allPeople.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5);

  const matchedResources = Object.entries(RESOURCE_PDFS).filter(([k,r]) =>
    r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q)
  );

  if(!matchedEntries.length && !matchedPeople.length && !matchedResources.length){
    box.innerHTML = `<div class="gs-empty">No matches for "${q}"</div>`;
    return;
  }
  let html = "";
  if(matchedEntries.length){
    html += `<div class="gs-group-label">Entries</div>` + matchedEntries.map(e=>`
      <div class="gs-item" onclick="closeGlobalSearch();goto('entryDetail', ${e.id})"><b>${e.title}</b><div class="gs-sub">${entryTypeLabel(e)} \u00b7 ${e.jr}</div></div>`).join("");
  }
  if(matchedPeople.length){
    const canDrilldown = ["faculty","admin"].includes(state.persona);
    html += `<div class="gs-group-label">People</div>` + matchedPeople.map(p=>{
      const canOpen = canDrilldown && (p.role==="Junior Resident" || p.role==="Senior Resident");
      const action = canOpen
        ? `closeGlobalSearch();goto('residentLogbook', null, '${p.name.replace(/'/g,"\\'")}')`
        : `closeGlobalSearch();toast('${p.name.replace(/'/g,"\\'")} \u2014 ${p.role}')`;
      return `<div class="gs-item" onclick="${action}"><b>${p.name}</b><div class="gs-sub">${p.role}${canOpen ? ' · click to open logbook' : ''}</div></div>`;
    }).join("");
  }
  if(matchedResources.length){
    html += `<div class="gs-group-label">Resources</div>` + matchedResources.map(([k,r])=>`
      <div class="gs-item" onclick="closeGlobalSearch();openResourcePdf('${k}')"><b>${r.name}</b><div class="gs-sub">${r.desc}</div></div>`).join("");
  }
  box.innerHTML = html;
}
function closeGlobalSearch(){
  const input = document.getElementById("globalSearchInput");
  if(input) input.value = "";
  const box = document.getElementById("gsResults");
  if(box){ box.innerHTML = ""; box.className = ""; }
}
document.addEventListener("click", (ev)=>{
  const wrap = document.querySelector(".global-search");
  if(wrap && !wrap.contains(ev.target)) closeGlobalSearch();
});

renderAll();
updateConnBadge();
</script>
